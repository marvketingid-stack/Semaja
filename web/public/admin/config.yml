# Decap CMS — panel untuk upload/menulis artikel tanpa menyentuh kode.
# Akses di /admin setelah deploy. Data disimpan sebagai file Markdown di repo.
#
# BACKEND: pilih salah satu (default: git-gateway untuk Netlify Identity).
# - Netlify: aktifkan Identity + Git Gateway di dashboard Netlify.
# - GitHub langsung: ganti blok backend jadi:
#     backend:
#       name: github
#       repo: OWNER/REPO
#       branch: main
backend:
  name: git-gateway
  branch: main

# Untuk testing lokal: jalankan `npm run cms` lalu buka http://localhost:4321/admin
local_backend: true

# Gambar yang di-upload disimpan di src/assets agar dioptimasi Astro.
media_folder: "src/assets/uploads"
public_folder: "../../assets/uploads"

publish_mode: editorial_workflow
site_url: https://semaja.id
display_url: https://semaja.id
locale: id

collections:
  - name: "articles"
    label: "Artikel / Jurnal"
    label_singular: "Artikel"
    folder: "src/content/articles"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    preview_path: "{{#if (eq fields.lang 'en')}}en/articles{{else}}artikel{{/if}}/{{slug}}"
    fields:
      - { label: "Judul", name: "title", widget: "string" }
      - { label: "Deskripsi singkat (untuk SEO & kartu)", name: "description", widget: "text" }
      - label: "Bahasa"
        name: "lang"
        widget: "select"
        default: "id"
        options:
          - { label: "Bahasa Indonesia", value: "id" }
          - { label: "English", value: "en" }
      - { label: "Tanggal terbit", name: "pubDate", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Tanggal update", name: "updatedDate", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false }
      - { label: "Penulis", name: "author", widget: "string", default: "Tim Semaja" }
      - { label: "Gambar cover", name: "cover", widget: "image", required: false }
      - { label: "Teks alternatif cover (alt)", name: "coverAlt", widget: "string", default: "", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Draft (jangan tampilkan)", name: "draft", widget: "boolean", default: false }
      - { label: "Isi artikel", name: "body", widget: "markdown" }
